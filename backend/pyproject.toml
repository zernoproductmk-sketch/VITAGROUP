[project]
name = "vitagroup-oee-backend"
version = "0.1.0"
description = "VITAGROUP OEE and payroll API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.28,<1.0",
  "openpyxl>=3.1,<4.0",
  "xlrd>=2.0,<3.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "email-validator>=2.2,<3.0"
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
