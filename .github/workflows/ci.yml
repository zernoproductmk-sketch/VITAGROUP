name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Compile backend
        run: python -m compileall -q app
      - name: Import application
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          AUTH_JWT_SECRET: ci-only-secret-that-is-long-enough-and-not-used-anywhere
        run: python -c "import app.main; print('backend import ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        run: npm install
      - name: Build frontend
        run: npm run build
